name: CD

on:
  push:
  repository_dispatch:
    types:
      - case_server_updated
      - cgmes_gl_server_updated
      - geo_data_updated
      - network_conversion_server_updated
      - network_map_server_updated
      - network_store_server_updated
      - single_line_diagram_server_updated
      - gridstudy_app_updated
      - study_server_updated
      - network_modification_server_updated
      - gateway_updated
      - loadflow_server_updated
      - study_notification_server_updated
      - actions_server_updated
      - security_analysis_server_updated
      - config_server_updated
      - config_notification_server_updated
      - filter_server_updated
      - directory_server_updated
      - dynamic_simulation_server_updated
      - dynamic_security_analysis_server_updated
      - report_server_updated
      - gridexplore_app_updated
      - directory-notification_server_updated
      - explore_server_updated
      - dynamic_mapping_server_updated
      - griddyna_app_updated
      - sensitivity_analysis_server_updated
      - user_admin_server_updated
      - user_identity_oidc_replication_server_updated
      - shortcircuit_server_updated
      - timeseries_server_updated
      - voltage_init_server_updated
      - case_import_server_updated
      - gridadmin_app_updated
      - study_config_server_updated
      - monitor_updated
      - gridmonitor_app_updated
      - monitor_notification_server_updated
      - gridrt_app_updated

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # NOTE: already in the default tooling of ubuntu runners
      # e.g. for 2026-10-08 runs action logs:
      # Runner Image
      #  Included Software: https://github.com/actions/runner-images/blob/ubuntu24/20260927.320/images/ubuntu/Ubuntu2404-Readme.md
      #    Kubectl 1.37.1
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3.1

      # NOTE: already in the default tooling of ubuntu runners but we set it up ourselves for consistency with kubectl
      # e.g. for 2026-10-08 runs action logs:
      # Runner Image
      #  Included Software: https://github.com/actions/runner-images/blob/ubuntu24/20260927.320/images/ubuntu/Ubuntu2404-Readme.md
      #    Kustomize 5.8.1
      # using a fixed version, just the latest stable release as of today
      - name: Set up kustomize
        run: |
          mkdir -p "$RUNNER_TEMP/kustomize-bin"
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/kustomize-bin"
          echo "$RUNNER_TEMP/kustomize-bin" >> "$GITHUB_PATH"

      # using a fixed version, just the latest stable release as of today
      - name: Set up kpt
        run: |
          mkdir -p "$RUNNER_TEMP/kpt-bin"
          curl -sL https://github.com/kptdev/kpt/releases/download/v1.0.1/kpt_linux_amd64 \
            -o "$RUNNER_TEMP/kpt-bin/kpt"
          chmod +x "$RUNNER_TEMP/kpt-bin/kpt"
          echo "$RUNNER_TEMP/kpt-bin" >> "$GITHUB_PATH"

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install python dependencies
        run: python -m pip install --upgrade pip pyyaml requests

      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Create key
        run: 'echo "$BASTION_KEY" > key; chmod 600 key'
        env:
          BASTION_KEY: ${{secrets.BASTION_KEY}}

      - name: Deploy to Azure
        run: |
          KRM_DISABLE_ATTRIBUTION=true \
            kpt live init \
              --namespace default \
              --name gridsuite-azure \
              --inventory-id gridsuite-azure \
              k8s/live/azure

          (cd k8s/live/azure && kustomize edit add resource resourcegroup.yaml)

          kubectl kustomize k8s/live/azure \
            | python .github/scripts/image-tag-to-digest.py \
            | ssh \
                -o "StrictHostKeyChecking no" \
                -i key \
                ${{ secrets.BASTION_LOGIN }}@${{ secrets.BASTION_HOST }} \
                kpt live apply \
                  --reconcile-timeout=15m \
                  --prune-timeout=5m \
                  --prune-propagation-policy=Foreground \
                  -
                # WARNING: for our azure demo deployment, the SSH_ORIGINAL_COMMAND
                # (kpt live apply...) is ignored, it is forced by the server via
                # ssh command for security
      - name: Delete key
        run: rm key
