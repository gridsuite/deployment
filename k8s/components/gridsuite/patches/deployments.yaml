apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-important
spec:
  # same as default server value for replicas, but set explicitly in config so that apply restores it if modified
  replicas: 1
  template:
    spec:
      containers:
        - name: main
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
      restartPolicy: Always
