<VirtualHost *:8080>
  DocumentRoot "/usr/local/apache2/htdocs"

  # We deliberately have no documents in the htdocs directory
  # to force httpd to reply with 404 for every request
  # (except for the 404.html and favicon files)
  # This is a bit of a hack, httpd always look for a file
  # which will never exist. should we use something more
  # specific to this use case ?
  ErrorDocument 404 /404.html

  # avoid (extremely rare) race condition errors with downstream reverse proxies that have a 1
  # minute timeout for idle keepalive connections (e.g. nginx-ingress-controller) (apache by
  # default uses 5s): use 65s to be juste a little bit above the downstream timeout.
  # example error: "upstream prematurely closed connection while reading response header"
  KeepAliveTimeout 65
</VirtualHost>
